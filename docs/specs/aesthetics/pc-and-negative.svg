<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 475" width="620" height="475" font-family="PingFang SC, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <radialGradient id="rimPC" r="0.5">
      <stop offset="0.80" stop-color="#6FE3FF" stop-opacity="0.02"/>
      <stop offset="0.97" stop-color="#6FE3FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6FE3FF" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="pcFrame"><rect width="540" height="390" rx="6"/></clipPath>
  </defs>
  <style>
    .t { fill:#E6EEF7; font-size:15px; font-weight:600; letter-spacing:0.8px; }
    .lab { fill:#9AA9BA; font-size:10px; }
    .lab3 { fill:#5C6B7D; font-size:9px; }
    .ink { fill:#E6EEF7; }
    .cyan { fill:#6FE3FF; }
    .mono { font-family:JetBrains Mono, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }
    .serif { font-family:Noto Serif SC, Source Han Serif SC, Songti SC, serif; }
    .rule { stroke:#24344A; fill:none; stroke-width:1; }
    .panel { fill:#0A0F17; fill-opacity:0.86; stroke:#24344A; stroke-width:1; }
  </style>
  <rect width="620" height="475" fill="#020305"/>
  <text x="40" y="34" class="t">PC 宽屏 · 正式实时对局（航天遥测侧栏 + 光信因果弧 + 2 px 键盘焦点）</text>

  <!-- ================= PC 宽屏窗口（540 × 390，右侧栏宽对应 360 pt） ================= -->
  <g transform="translate(40,56)">
    <g clip-path="url(#pcFrame)">
      <rect width="540" height="390" fill="#05070B"/>

      <!-- 左侧主星图区域（宽 345 px） -->
      <g transform="translate(172,188)">
        <ellipse rx="52" ry="18" class="rule"/>
        <ellipse rx="104" ry="36" class="rule"/>
        <ellipse rx="148" ry="50" class="rule" stroke-dasharray="2 4"/>
        <line x1="-148" y1="0" x2="148" y2="0" class="rule" stroke-dasharray="2 4"/>
      </g>
      <!-- 背景星 + 落地线 -->
      <g>
        <line x1="62" y1="128" x2="62" y2="182" stroke="#24344A"/><circle cx="62" cy="128" r="1.5" fill="#FFDDB4"/>
        <line x1="274" y1="122" x2="274" y2="174" stroke="#24344A"/><circle cx="274" cy="122" r="1.4" fill="#CAD8FF"/>
        <line x1="98" y1="246" x2="98" y2="202" stroke="#24344A"/><circle cx="98" cy="246" r="1.2" fill="#FFF4E8"/>
        <circle cx="40" cy="96" r="1" fill="#FFF4E8"/><circle cx="304" cy="264" r="1.1" fill="#FFBD6F"/>
        <circle cx="206" cy="84" r="1" fill="#FBF8FF"/><circle cx="52" cy="276" r="1.1" fill="#AABFFF"/>
      </g>
      <!-- 包络与节点 -->
      <circle cx="172" cy="188" r="112" fill="none" stroke="#EAF2FF" stroke-opacity="0.16"/>
      <circle cx="172" cy="188" r="74" fill="none" stroke="#6FE3FF" stroke-opacity="0.5" stroke-dasharray="3 5"/>
      <circle cx="172" cy="188" r="39" fill="url(#rimPC)"/>
      <line x1="172" y1="188" x2="246" y2="188" stroke="#2C7F99" stroke-opacity="0.7" stroke-dasharray="1.5 4"/>
      <g transform="translate(172,188)" stroke="#6FE3FF" stroke-width="1.3" fill="none">
        <circle r="2.5" fill="#FFF4E8" stroke="none"/><circle r="9"/>
        <line x1="12" y1="0" x2="16" y2="0"/><line x1="-12" y1="0" x2="-16" y2="0"/>
        <line x1="0" y1="12" x2="0" y2="16"/><line x1="0" y1="-12" x2="0" y2="-16"/>
      </g>
      <g transform="translate(246,188)">
        <circle r="2.5" fill="#FFDDB4"/>
        <circle r="9" fill="none" stroke="#6FE3FF" stroke-width="1.3" stroke-dasharray="3 3"/>
        <path d="M -15 -10 L -15 -15 L -10 -15 M 10 -15 L 15 -15 L 15 -10 M 15 10 L 15 15 L 10 15 M -10 15 L -15 15 L -15 10" fill="none" stroke="#E6EEF7" stroke-width="1.1"/>
      </g>
      <text x="163" y="214" class="lab">A</text>
      <text x="242" y="214" class="lab">B</text>

      <!-- 星图顶部遥测横条 -->
      <rect x="0" y="0" width="345" height="52" fill="#0A0F17" fill-opacity="0.86"/>
      <line x1="0" y1="52" x2="345" y2="52" class="rule"/>
      <text x="12" y="19" class="lab3 mono" font-size="8.2">E01 · 中密度 · SEAT A</text>
      <text x="12" y="40" class="ink serif" font-size="13.5">天时 <tspan class="mono" font-size="13">T+ 20.0</tspan> <tspan class="lab" font-size="9.5">年</tspan></text>
      <text x="130" y="40" class="lab3 mono" font-size="8.5">V_E +0.18/YR</text>

      <!-- 顶部右：视角分段 + 纯享/语言开关 -->
      <rect x="196" y="10" width="96" height="20" rx="2" fill="#05070B" stroke="#24344A"/>
      <rect x="244" y="12" width="46" height="16" rx="1.5" fill="#121A26"/>
      <line x1="250" y1="28" x2="284" y2="28" stroke="#6FE3FF" stroke-width="1.2"/>
      <text x="220" y="23" text-anchor="middle" class="lab" font-size="8.8">天球仪</text>
      <text x="267" y="23" text-anchor="middle" class="ink" font-size="8.8">星泡图</text>

      <rect x="298" y="10" width="36" height="20" rx="2" fill="#121A26" stroke="#24344A"/>
      <text x="316" y="23" text-anchor="middle" class="lab" font-size="8.5">纯享</text>
      <text x="334" y="44" text-anchor="end" class="lab3 mono" font-size="7.8">ZH / EN</text>

      <!-- 底部横贯：光信因果任务弧线 -->
      <g>
        <text x="14" y="308" class="lab3 mono" font-size="7.5">CAUSALITY · 光信因果轨</text>
        <path d="M 18 326 Q 172 308 328 326" fill="none" stroke="#24344A" stroke-width="1.1" stroke-dasharray="3 3"/>
        <path d="M 18 326 Q 98 317 176 317" fill="none" stroke="#6FE3FF" stroke-width="1.4"/>
        <circle cx="18" cy="326" r="2.3" fill="#E6EEF7"/>
        <circle cx="96" cy="319" r="2.3" fill="#E6EEF7"/>
        <circle cx="176" cy="317" r="3.6" fill="#05070B" stroke="#6FE3FF" stroke-width="1.5"/>
        <circle cx="256" cy="320" r="2.4" fill="#05070B" stroke="#5C6B7D" stroke-dasharray="2 2"/>
        <circle cx="328" cy="326" r="2.4" fill="#05070B" stroke="#5C6B7D" stroke-dasharray="2 2"/>
        <text x="18" y="338" class="lab3 mono" font-size="7.2">T+0</text>
        <text x="96" y="336" text-anchor="middle" class="lab3 mono" font-size="7.2">4.0yr</text>
        <text x="176" y="335" text-anchor="middle" class="cyan mono" font-size="7.2">20.0yr 远征</text>
        <text x="256" y="336" text-anchor="middle" class="lab3 mono" font-size="7.2">40.0yr</text>
        <text x="328" y="338" text-anchor="end" class="lab3 mono" font-size="7.2">44.0yr</text>
      </g>

      <!-- 星图底部控制条 -->
      <line x1="0" y1="344" x2="345" y2="344" class="rule"/>
      <text x="14" y="357" class="lab3">已确认 <tspan class="ink mono">1</tspan>   可达 <tspan class="ink mono">0</tspan>   冗余 <tspan class="ink mono">1.00</tspan></text>
      <rect x="14" y="363" width="66" height="20" rx="2" class="panel"/>
      <circle cx="23" cy="373" r="1.8" fill="#6FE3FF"/>
      <text x="50" y="376" text-anchor="middle" class="ink" font-size="9">观测·巡天</text>
      <rect x="86" y="363" width="58" height="20" rx="2" class="panel"/>
      <text x="115" y="376" text-anchor="middle" class="lab" font-size="9">隐匿·关</text>
      <rect x="150" y="363" width="52" height="20" rx="2" class="panel"/>
      <text x="176" y="376" text-anchor="middle" class="lab" font-size="9">队列 3</text>
      <text x="332" y="376" text-anchor="end" class="lab3 mono" font-size="8">TAB 焦点 · ESC 关闭</text>

      <!-- ================= 右侧停靠航电侧栏（宽 195px，对应 360pt 比例） ================= -->
      <rect x="345" y="0" width="195" height="390" fill="#0A0F17"/>
      <line x1="345" y1="0" x2="345" y2="390" class="rule"/>

      <!-- 远征航程与波壳刻度 -->
      <text x="358" y="20" class="lab3 mono" font-size="8">EXP → B · 远征航距</text>
      <text x="526" y="20" text-anchor="end" class="ink mono" font-size="10">2.00 → 4.00 <tspan class="lab3" font-size="8">LY</tspan></text>
      <line x1="358" y1="36" x2="526" y2="36" stroke="#24344A" stroke-width="3" stroke-linecap="round"/>
      <line x1="358" y1="36" x2="476" y2="36" stroke="#6FE3FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="490" cy="36" r="4.2" fill="none" stroke="#6FE3FF" stroke-width="1.2" stroke-dasharray="2 2"/>
      <circle cx="476" cy="36" r="5.5" fill="#0A0F17" stroke="#6FE3FF" stroke-width="1.8"/>
      <text x="358" y="51" class="lab3 mono" font-size="8">0.01</text>
      <text x="406" y="51" class="lab3 mono" font-size="8">0.1</text>
      <text x="456" y="51" class="lab3 mono" font-size="8">1</text>
      <text x="515" y="51" class="lab3 mono" font-size="8">20</text>
      <line x1="358" y1="61" x2="526" y2="61" class="rule"/>

      <!-- 节点遥测详情 -->
      <text x="358" y="84" class="ink serif" font-size="17">B</text>
      <text x="376" y="83" class="lab">K 型主序星</text>
      <rect x="456" y="70" width="70" height="17" rx="2" fill="#121A26" stroke="#6FE3FF" stroke-dasharray="2.5 2.5"/>
      <text x="491" y="81.5" text-anchor="middle" class="cyan mono" font-size="8.2">待确认</text>

      <text x="358" y="105" class="lab3 mono" font-size="8.5">星表距离</text>
      <text x="526" y="105" text-anchor="end" class="ink mono" font-size="11">4.00 LY</text>
      <text x="358" y="123" class="lab3 mono" font-size="8.5">单程光行</text>
      <text x="526" y="123" text-anchor="end" class="ink mono" font-size="11">4.0 年 · 4:00</text>
      <text x="358" y="141" class="lab3 mono" font-size="8.5">最近光信</text>
      <text x="526" y="141" text-anchor="end" class="lab3 mono" font-size="9.5">在途 · 尚无回执</text>
      <text x="358" y="162" class="lab3 serif" font-size="9.5" font-style="italic">你看到的 B，是它 4.0 年前的样子。</text>
      <line x1="358" y1="174" x2="526" y2="174" class="rule"/>

      <!-- 双球姿态微缩图 + SDI / HEAT 双通道细条仪 -->
      <g transform="translate(376,204)">
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#24344A" stroke-width="0.7"/>
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#24344A" stroke-width="0.7"/>
        <circle r="14" fill="none" stroke="#EAF2FF" stroke-opacity="0.28" stroke-width="0.8"/>
        <circle r="9" fill="none" stroke="#6FE3FF" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="2 2"/>
        <circle r="5" fill="#6FE3FF" fill-opacity="0.1" stroke="#6FE3FF" stroke-width="1"/>
        <circle r="1.2" fill="#FFF4E8"/>
      </g>
      <text x="402" y="196" class="lab3 mono" font-size="8">SDI</text>
      <rect x="430" y="191" width="66" height="4" rx="1" fill="#121A26" stroke="#24344A" stroke-width="0.7"/>
      <rect x="430" y="191" width="8" height="4" rx="1" fill="#2C7F99"/>
      <line x1="455" y1="189" x2="455" y2="197" stroke="#5C6B7D" stroke-width="0.9"/>
      <text x="526" y="196" text-anchor="end" class="ink mono" font-size="8.5">12%</text>

      <text x="402" y="214" class="lab3 mono" font-size="8">HEAT</text>
      <rect x="430" y="209" width="66" height="4" rx="1" fill="#121A26" stroke="#24344A" stroke-width="0.7"/>
      <rect x="430" y="209" width="12" height="4" rx="1" fill="#FF8A3D"/>
      <text x="526" y="214" text-anchor="end" class="lab mono" font-size="8.5">18%</text>

      <text x="402" y="229" class="cyan mono" font-size="8">+0.10c  远征进行中</text>
      <line x1="358" y1="240" x2="526" y2="240" class="rule"/>

      <!-- L1 离线护航卡 -->
      <text x="358" y="258" class="lab3 mono" font-size="8.5">离线护航 · REFLEX L1</text>
      <rect x="358" y="266" width="168" height="42" rx="3" fill="#121A26" stroke="#24344A"/>
      <circle cx="371" cy="280" r="2.8" fill="#4CF2A0"/>
      <text x="380" y="283.5" class="ink" font-size="10">L1 确定性白名单 · 3槽</text>
      <text x="369" y="298" class="lab3" font-size="9">外部 Agent · 预留未接入</text>

      <!-- 键盘焦点主按钮（2 px 外描边） -->
      <rect x="356" y="328" width="172" height="36" rx="4" fill="none" stroke="#6FE3FF" stroke-width="2"/>
      <rect x="360" y="332" width="164" height="28" rx="3" fill="#6FE3FF" fill-opacity="0.10" stroke="#6FE3FF" stroke-width="1"/>
      <text x="442" y="350" text-anchor="middle" fill="#6FE3FF" font-size="11">派出远征 → B (4.00 光年)</text>
      <text x="442" y="378" text-anchor="middle" class="lab3">2 px 键盘焦点框</text>
    </g>
    <rect width="540" height="390" rx="6" fill="none" stroke="#24344A" stroke-width="1.5"/>
  </g>
</svg>
