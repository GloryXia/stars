<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070B">
  <title>404 · 光锥之外 · Beyond the Light Cone</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>
    // Handle clean paths without trailing slash on strict static hosts
    (function () {
      const p = window.location.pathname.replace(/\/+$/, '');
      const map = {
        '/guide': '/guide/index.html',
        '/login': '/login/index.html',
        '/register': '/register/index.html',
        '/play': '/play/index.html',
        '/download': '/download/index.html'
      };
      if (map[p]) {
        window.location.replace(map[p] + window.location.search + window.location.hash);
      }
    })();
  </script>
  <script defer src="/assets/js/i18n.js"></script>
  <script defer src="/assets/js/starfield.js"></script>
  <script defer src="/assets/js/app.js"></script>
</head>
<body>
  <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand-link" href="/index.html">
        <img class="brand-mark" src="/assets/img/logo-mark.svg" alt="" width="34" height="34">
        <span class="brand-text">
          <span class="brand-title" data-i18n="brand.title">光锥之外</span>
          <span class="brand-sub" data-i18n="brand.sub">BEYOND THE LIGHT CONE</span>
        </span>
      </a>
      <div class="header-actions">
        <button type="button" class="lang-toggle" data-lang-toggle>EN / 中文</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-block:96px;display:grid;gap:24px;max-width:780px;">
    <div class="panel">
      <span class="eyebrow" data-i18n="404.eyebrow">404 · 页面不存在</span>
      <h1 class="section-title" data-i18n="404.title">找不到这个页面</h1>
      <p class="section-lead" style="margin-top:12px;" data-i18n="404.desc">请点击下方按钮回到官网常用页面。</p>
      <div class="portal-links" style="margin-top:24px;">
        <a class="btn btn-primary" href="/index.html" data-i18n="nav.home">首页</a>
        <a class="btn" href="/play/index.html" data-i18n="portal.btn.play">进入游戏</a>
        <a class="btn btn-subtle" href="/login/index.html" data-i18n="portal.btn.login">登录</a>
        <a class="btn btn-subtle" href="/register/index.html" data-i18n="portal.btn.register">注册</a>
        <a class="btn btn-subtle" href="/download/index.html" data-i18n="portal.btn.download">下载应用（iOS / 安卓）</a>
      </div>
    </div>
  </main>
</body>
</html>
